name: Development builds

# Unsigned development builds on all three OSes (phase 1). Signing,
# notarization and auto-update are added before the public beta (phase 4).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, linux, darwin, win32]
        default: all
  schedule:
    - cron: "41 3 * * 1"

# One run at a time per branch: a newer run replaces a queued or running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ONLY: ${{ inputs.platform || 'all' }}
        run: |
          ALL='[{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"macos-latest","platform":"darwin","arch":"arm64"},{"os":"windows-latest","platform":"win32","arch":"x64"}]'
          echo "matrix=$(echo "$ALL" | jq -c --arg only "$ONLY" 'map(select($only == "all" or .platform == $only))')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # Outside the workspace: see build/lib.mjs.
      SYNAPSE_VSCODE_DIR: ${{ github.workspace }}/../synapse-vscode
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned upstream toolchain
        id: pin
        shell: bash
        run: echo "node=$(node -p 'require("./build/upstream.json").node')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.pin.outputs.node }}
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev xvfb
      - run: npm ci && npm run build
      - run: node build/build.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        env:
          # Upstream's install downloads prebuilt binaries (e.g. ripgrep) through the GitHub API;
          # unauthenticated requests from shared runners hit the rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Launch the built app and check it (smoke test)
        shell: bash
        run: |
          app="$SYNAPSE_VSCODE_DIR/../VSCode-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a --server-args="-screen 0 1440x900x24" node build/smoke-app.mjs "$app" --screenshot smoke-${{ matrix.platform }}.png
          else
            node build/smoke-app.mjs "$app" --screenshot smoke-${{ matrix.platform }}.png
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: smoke-${{ matrix.platform }}.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Move the build into the workspace (artifact paths cannot use ..)
        shell: bash
        # Retry: on Windows a just-closed app can hold files for a few seconds.
        run: |
          src="$SYNAPSE_VSCODE_DIR/../VSCode-${{ matrix.platform }}-${{ matrix.arch }}"
          for i in 1 2 3 4 5 6; do
            mv "$src" . && exit 0
            echo "move failed (attempt $i), retrying in 5 s"
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: synapse-${{ matrix.platform }}-${{ matrix.arch }}
          path: VSCode-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
