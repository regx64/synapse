name: ACP compatibility

# Nightly check that the pinned agent adapters still speak ACP v1 (risk T3).
# Never sends a prompt, so it costs nothing.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - run: node scripts/acp-compat.mjs claude codex mock
